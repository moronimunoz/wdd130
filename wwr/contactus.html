<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us - WHITEWATER</title>
    <meta name="description"
      content="Learn about WHITEWATER, a family-owned white water rafting company, and see experiences shared by our clients.">
    <meta name="author" content="Moroni Muñoz">
    <link rel="stylesheet" href="styles/rafting.css">

</head>

<body>

    <!-- ========== HEADER ========== -->
    <header class="site-header container">
        <a href="index.html" class="site-logo">
            <img src="images/whitewater.webp" alt="WHITEWATER logo">
        </a>
        <nav class="main-nav">
            <ul class="nav-list">
                <li><a href="https://moronimunoz.github.io/wdd130/">Home</a></li>
                <li><a href="about.html" aria-current="page">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <!-- ========== MAIN ========== -->
    <main class="container">
        <h1>White Water Rafting Company</h1>

        <address class="info">
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </address>

        <!-- Contenedor de 2 columnas -->
        <div class="contact-layout">

            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2735.2920882403514!2d-60.633313939867065!3d-32.94720868952697!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95b7abbcd80c2acb%3A0xe9b7db9efb6c048!2sCorreo%20Argentino%20-%20Sucursal%20Correo%20Central%20Rosario!5e0!3m2!1ses-419!2sar!4v1791139620123!5m2!1ses-419!2sar"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin" title="Map of our location"
                  loading="lazy"></iframe>
            </div>

            <form class="contact-form" action="#" method="post">

                <div class="field">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Placeholder">
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Placeholder">
                </div>

                <div class="field purpose" role="group" aria-labelledby="purpose-label">
                    <span id="purpose-label">Message Purpose</span>
                    <div class="options">
                        <label><input type="checkbox" name="general"> General Inquiry</label>
                        <label><input type="checkbox" name="reservation"> Reservation
                            Question</label>
                        <label><input type="checkbox" name="website"> Website Suggestion</label>
                    </div>
                </div>

                <div class="field message">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4"
                      placeholder="Type here"></textarea>
                </div>

                <label class="newsletter">
                    <input type="checkbox" name="newsletter" checked>
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>
            </form>
        </div>
    </main>

    <!-- ========== FOOTER ========== -->
    <footer class="site-footer container">
        <p class="copyright">&copy; 2026 WhiteWater Moroni Muñoz</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/Franco.M.Munoz?locale=es_LA"
              aria-label="logo Facebook">
                <img src="images/facebook-square.svg" alt="">
            </a>
            <a href="https://www.linkedin.com/in/franco-moroni-mu%C3%B1oz/"
              aria-label="logo LinkedIn">
                <img src="images/linkedin-square.svg" alt="">
            </a>
            <a href="#" aria-label="logo Instagram">
                <img src="images/instagram-square.svg" alt="">
            </a>
        </nav>
    </footer>

</body>

</html>
