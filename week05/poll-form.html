<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header>
    </header>
    <main>
        <h1>WDD 130 | HTML Form - User poll</h1>
        <label for="fullname">Full name:</label>
        <input type="text" id="username" name="username" required>
        <label for="usermail">Email:</label>
        <input type="email" id="usermail" name="usermail" required>
        <label for="browser">What is your favorite browser?</label>
        <select name="browser" id="browser">
            <option value="chrome">Chrome</option>
            <option value="firefox">Firefox</option>
            <option value="edge">Edge</option>
            <option value="brave">Brave</option>
            <option value="other">Other</option>
        </select>
        <label for="pet">Do you have a household pet?</label>
        <input type="checkbox" id="pet" name="pet">
        <label for="feedback">List the places you have lived:</label>
        <textarea id="feedback" name="feedback" row="4"
          placeholder="Still Florida, Amsterdam Netherlands, Timbuktu Mali">
            </textarea>
        <button type="submit">Sudmit Poll</button>
    </main>
    <footer>
        <p>&copy; 2026 | Moroni Muñoz | Santa Fe, Argentina.</p>
    </footer>
</body>

</html>
